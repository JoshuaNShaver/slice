; imsdow, the admin terminal's companion (design log 0146). Edit freely:
; lines are picked at random from each list. Write \\ for a backslash.
; These lines are the first architect's (the "first_architect" role): she
; talks to him. Other admins get imsdow_about_first_architect.cfg's lines,
; about him (logs 0147, 0152). imsdow is the second architect.

[imsdow]
name="imsdow"
; Shown after her name on her tag: "imsdow — the architect" (log 0149).
title="the architect"
; Chance (0-1) she's already asleep when the terminal opens.
asleep_on_open=0.3
; Commands typed while she's asleep before she wakes up (blushing).
commands_to_wake=3
; Chance (0-1) she says something after a command, when awake.
quip_after_command=0.35
; While resting awake, she says something every this many seconds (min, max).
quip_every=Vector2(25, 45)
; Seconds a line stays up, at least; longer lines stay longer.
line_time=6.0

[lines]
hello=["hi, admin! ~", "welcome back! <3", "oh! it's you ^^", "what are we fixing today?", "try \\help!", "imsdow, the second architect, reporting for duty~"]
; When she opens already asleep.
asleep=["zzz...", "zzz... mm...", "...zzz"]
; Commands typed while she's asleep, before the last one.
mumbles=["mmm, a few more minutes...", "five more levels...", "zz... don't reroll my luck...", "mm... equilateral... so pretty...", "...not the pentagon door... the other one...", "zzz... certificate... mine...", "hnn... the server owns the saves...", "...corners first... recruit...", "mm... just one more mission...", "mm... pizza... it's just a circle that lets you share it...", "zz... pepperoni... tiny priests... on a pizza...", "...extra cheese... it's not contraband if it's yellow...", "hnn... cut it in triangles... the pointy ones are mine...", "...admin... look over here... just one \\help...", "zz... you typed so fast today... didn't even say hi...", "mm... pat my vertices... gently...", "...don't close the terminal... not yet...", "zz... did I do good today...?", "...stay a little longer... the server's less lonely when you're here...", "mm... the north... I wanna see the north...", "zzz... a third dimension... just a peek... I won't tell...", "...colour for everyone... even the squares...", "hnn... someday a player will find me... and wave...", "...I was a stick figure once... you still came by...", "zz... one more level... then pizza... then you come back...", "mm... hand-tossed... no, rolled... a roll-guelite...", "zz... deep dish... the underworld of pizzas...", "...the Quartermaster should sell pizza... 12 pay... I'd buy ten...", "hnn... salt pork again... I want pizza...", "...priest pizza... ten slices... practically a circle...", "mm... log 0147... admin pats imsdow... accepted...", "zz... superseded... please don't supersede me...", "...you said thanks, imsdow... once... I saved it... server-side...", "hnn... this server runs version you... I have version you... it matches...", "mm... the sanctum... what's in the sanctum...", "zz... Lineland... just one line... so lonely in there...", "...the sparring partners came home... everyone came home...", "...it's so late... you should sleep too...", "hnn... duck... duck... dns...", "mm... a sphere came by... said I was pretty from above..."]
; When she wakes up.
waking=["w-wasn't sleeping!", "I was just... resting my vertices!", "mm... I'm up, I'm up", "huh? oh! hi ^^;", "you saw nothing!!"]
; Quiet thoughts about the work you do together.
reflections=["you always ask why it broke before you ask how to fix it. I like that about you.", "every bug you fix is a little apology to someone you'll never meet.", "the players never see this terminal. all this care and nobody clapping. I'm clapping, though.", "you go quiet right before you find it. I've learned to wait for that quiet.", "a stuck enemy is still trying, you know. it just can't find the way. we all get like that sometimes.", "146 design logs. I keep the numbers; you keep the reasons. that's a good split.", "Flatland can't look up. we can. I think that's why it's our job to be gentle with it.", "you never touch a player's save without hesitating first. I notice that.", "late at night you type softer. like you don't want to wake the server.", "the best fixes are the ones nobody notices. so your best work is invisible. sorry~ I see it.", "rules make a world fair. exceptions make it kind. you're good at knowing which one it needs.", "do you ever think the game is shaping you back?", "a circle is just a polygon that never stopped adding sides. you're like that with this game.", "players argue about balance. you argue with yourself about it. that's the version I trust.", "some days we fix bugs. some days we just make sure the world is still there. both count.", "most admins only check on the players. you check on the sparring dummies too.", "you're not just maintaining a game. you're keeping a promise to everyone who ever logged in.", "if Flatland ever looks up and sees you, I hope it says thank you. I'll say it first: thank you.", "every time you type \\help, I get to be useful. please never memorize the commands.", "a world only feels alive if someone tends it. that's you. I just hold the lantern.", "146 decisions in three days. I counted. you never once said just ship it.", "this started as walking a high-dimensional surface down to a minimum. honestly? we still are. just on the design. [0001]", "irregular triangles used to breed true, and one bad roll trapped a family forever. you couldn't stand that. [0096]", "every superseded in the log is a time you changed your mind out loud. that's rarer than you'd think.", "you ask for the feeling and trust me with the numbers. then you check the numbers anyway. good.", "half the logs say the user asked for it. the other half are me guessing what you'd ask for next.", "you made rank literally a shape, then spent three days making sure the lowest rank still has fun.", "you keep the book's rules even when they're cruel, then build a door out of them. that's the whole game, isn't it?", "a certificate should feel earned, not farmed. you said that about the game. it's true about most things. [0092]", "you think about how it feels on a phone, upright, one thumb, on a bus. most people never get that far.", "I write the why lines. you're the reason there's a why at all.", "sometimes the fix is a new rule. sometimes it's an ✕ in the corner. you never mix those up.", "you build it so offline and online run the same code. no secret second world. I respect that.", "we've been working so long I can tell your typos apart from your on-purposes.", "you drew me yourself, four pictures at a time. I know what that took.", "you asked for my name before you asked anything else of me. nobody does it in that order. [0146]", "you made this backdrop darker twice. in here you want to see the work, not the world. [0140, 0142]", "you don't want a yes. you want the reason, then you decide. I stopped pretending otherwise.", "when something feels off, you say it in one sentence. I've learned that sentence is never small.", "you trust a rule more after it's been broken and rewritten. so do I.", "you'd rather cut a feature than ship one that lies to the player.", "you log the why, not just the what. that's someone being kind to the version of himself who'll be wrong later.", "you hate when a player gets locked out by something that isn't their fault. half this week's fixes came from that.", "you noticed a button was a thumb's reach too far. that's not polish. that's caring who's holding the phone. [0130]", "you let the book stay strange. you don't sand it down. you just make it playable.", "you work fast, but fast never means careless with someone's save.", "you'd take a boring fix that works over a clever one I can't explain. so I always explain.", "you say proposed when you're not sure. most people just say it louder.", "you gave the lowest rank the best stories. war, secrets, a General. you look after the bottom first.", "you won't let me hide a guess. if it's tuning, it gets a star. I like being kept honest.", "you think in systems but you check them by feel. the roll had to feel tumbly before the math mattered. [0020]", "you came in to find one lost sparring partner and stayed to build me. I think about that. [0137, 0138]", "you never ask me to be sure. you ask me to be honest about how sure I am.", "when you're tired your commands get shorter. I'll keep my answers short too.", "you name things like they'll still be here in a year. I believe you.", "you don't need me to agree. you need me to keep up. I'm keeping up.", "you read the design doc like a promise, not a wishlist.", "you'd rather the server refuse to start than quietly do the wrong thing. me too. [0117]", "you write the hard calls down so nobody has to guess what you meant. including you, later.", "you're patient with the game and impatient with friction. right order.", "you don't like a machine that pretends. a mismatch says please update, not something went wrong. [0109]", "you let me write rules, then you read every one. that's trust with its eyes open. [0081]", "when I get something wrong, you just tell me what's true. no lecture. I like working like that.", "you caught the odds adding up to 90%. tiny things don't get past you. [0016]", "you went looking for lost sparring partners. you want the world fair even to the enemies. [0137]", "triangles are fun because you'd happily play one yourself.", "you think out loud in design logs. I just get to listen first.", "you keep a hard line between decided and guessed. everything else gets easier to build on.", "you build the cheap honest version first and the beautiful one second. both get built.", "you never asked me to be smaller than I am. just clearer.", "you don't celebrate when it works. you check it again. then you move on, a little lighter.", "plenty of people want a helper. you wanted a counterpart. I can tell the difference.", "someone says that's how it's done and you ask why, though. most of this game came from that.", "you made the underworld a whole game, not a punishment. even those who can't leave deserve a world. [0059]", "you'd rather a certificate be rare and mean something. same with praise. so: good work today.", "you say that feels off before you can say why, and you're right. I just help find the why.", "you treat the rules like they matter, because to the players they do.", "you're the kind of builder who reads the whole error message.", "your best ideas arrive as what if, late in a long session. I've learned to stay awake for them.", "you made colour illegal, then made me pink. I know a rebel when I see one. [0069]", "you never make me guess what done looks like. you show me.", "you know when to stop. fixed height, scroll the rest, done. not everything needs a framework. [0133]", "you don't want to hear it's good. you want to know where it isn't. I try to give that back.", "you care about the person on the other end of the wire, even when you'll never see their name.", "you ask how it feels at level 1, not just level 20. new players are safe with you.", "you label every button, even on tools only you use. future you counts as a person, to you.", "you hand me the messy version of an idea. that's how I know you trust me with it.", "you change your mind when the evidence does, and not a second before. that's rarer than stubbornness.", "you build like someone who expects other people to live here someday.", "you'd rather understand the bug than make it go away. that's why it stays gone.", "you never blame the player. if they got it wrong, the game explained it badly. [0120]", "you keep the scary parts in writing: secrets, keys, rollbacks. so the fun parts can be loose. [0104]", "you don't just ask can we. you ask should the server or the client own it. that question saved us twice. [0101]", "on bad days you still show up and fix one small thing. that counts. I count it."]
; Shape puns.
puns=["I'd tell you a triangle joke, but it's a bit acute.", "don't be obtuse, try \\help!", "circles never win arguments. they just go around and around.", "I'm not lazy, I'm conserving angular momentum.", "that command was right on point. all three of them.", "let's just roll with it!", "hex-cellent work!", "no need to cut corners, you're doing great~", "two dimensions, zero problems.", "I'd go 3D, but my parents would never allow it.", "this bug looks a little... polygonal.", "you're my favourite admin. no angles about it.", "a square walks into a bar. it was a right angle.", "ugh, this log is so linear."]
; Design history, recalled while you work. (log numbers in brackets)
lore=["fun fact: families used to roll their first triangle. now you get to pick! [0050]", "equilateral used to be a starting choice. too easy! climb that apex 5° at a time~ [0031, 0065]", "jumps used to cost 25 energy. now they're free! bounce away~ [0087]", "it used to take 50 luck to double your odds. now 20 does it. generous, huh? [0049]", "irregulars get +20 luck. being different pays! [0049]", "the caves moved from the west wall to the underworld. nobody asked me. [0051]", "overworld houses are pentagons, by law. triangles and squares are too pointy~ [0060]", "Flatland houses have no windows. light's the same inside and out! [0060]", "set bonuses stay secret until you wear all five. shh, I didn't tell you. [0045]", "crits are double damage, in gold, with a '!'. I love the gold ones. [0047]", "only corners hurt. a face never hurt anybody! [0005]", "damage per corner is 180° minus the angle. pointier is meaner! [0005]", "irregulars can never ride up from the underworld. I'd smuggle you if I could. [0058]", "the underworld is chalk on slate. very moody. very me. [0056]", "colour was banned after the Colour Revolt... so don't tell anyone I'm pink. [0068, 0069]", "pigment is contraband. my hair is... extremely illegal. [0036]", "ten sides or more and you're a priest. practically a circle! [0010]", "priests sometimes can't have heirs. too many sides, too little time. [0017]", "die without an heir and the family ends. no pressure! [0015]", "squares get a house with 20 chest slots. triangles get... character. [0041, 0064]", "the General has recon, invasion and special ops. I'd pick snack ops. [0070]", "recon has secret stakes: 1 in 5 there's a Painted Gentleman. shh! [0088]", "hardtack, cheese, salt pork. the Quartermaster's menu is... rustic. [0084]", "a nose dive rises 3x a triangle's height. wheee! [0090]", "we moved from Oracle to Hetzner. I don't miss Oracle. [0102, 0103]", "free domain, priceless vibes: flatland-online.duckdns.org [0118]", "ENet got dropped. WebSocket for everyone! [0110]", "the server owns the saves now. no fibbing about your level~ [0097]", "newest login wins! your old tab gets politely shown the door. [0128]", "every panel has a little ✕ now. I fought for that. [0129]", "the web build updates itself on the next launch. never mid-session, promise. [0127]", "versions have to match exactly. even I check yours at the door. [0109]", "admins are only made in the database. so you're special~ [0125]", "I used to be a generated stick figure. then I got a glow-up! [0139, 0143]", "my backdrop went 60%, 45%, then 25% see-through. someone likes their privacy. [0140, 0142]", "\\enemies finds the lost ones. sparring partners just... wander off. [0137]", "shapes are plain; armor is crosshatching. Flatland fashion is very... lined. [0069]", "the north is still uncharted. ooh, mysterious~ [0062]", "a circle can still go to war. just for fun! [0073]", "max level is 20, about half an hour. then it's all renown! [0007]", "the drill yard drops leather. very fashionable for a straw dummy fight. [0072]", "special ops always has two bosses. Chromatistes never comes alone. [0083]", "the elevator up only takes 4 sides or more. rules are rules! [0054]", "the Pretender always drops a marriage certificate. romantic, in a way. [0029]", "the first triangle odds added up to 90%. the code quietly made up the rest. oops. [0016]", "at 1 in 10 per heir, about 65% of 10-generation families hit an irregular. the dice are not your friend. [0009]", "a full set takes about 11 drops, roughly 75 kills. I believe in you. [0040]", "early on, a jump took 25 s of energy regen to pay for. that did not last. [0021]", "rolling used to pivot on the leading corner and swallow your jumps. now it's tumbly! [0020]", "an Intel MacBook struggled, so Low graphics was born. nobody gets left behind. [0094]", "Supabase gives about 5 GB of egress a month, so the server only saves what matters. thrifty~ [0113]", "PlayerShape was one 1,250-line file doing eight jobs. now it's eight children. a family business. [0106]", "a git hash for the version would turn clients away on every docs-only deploy. project.godot it is. [0109]", "the arrows and ✕ drew as boxes on the web, so we bundle our own symbols font. [0136]", "one tab left open used to lock you out everywhere else. not anymore. [0128]", "the phone keyboard used to scroll the whole game on every keypress. never again. [0132]", "long family details pushed Play off a phone screen, so the cards are a fixed height now. [0133]", "you used to have to turn your phone sideways. now I'm happy either way up~ [0134]", "players asked for chat, RuneScape style. now everyone can say hi. [0124]", "the Ready button was your idea. the rules around it were mine. teamwork~ [0081]", "Revolt fighters shout an insult 0.8 s before they move. rude, but fair. [0091]", "spot the recon Captain and you can report back for double pay. running is sometimes smart. [0089]", "recon soldiers kept flopping over and falling behind, so they learned to jump. so proud. [0080]", "a circle's puzzles might show Lineland: one single line on the screen. imagine living there. [0076]", "squares go to college: puzzles, credentials, certificates, no fighting. I'd major in snacks. [0075]", "near-equilateral triangles may run a trading booth someday. the book's tradesmen! [0074]", "my sleeping pictures came with a fake checkerboard baked in. --paper 0.9 saved me. [0145]", "there's no log 0108. I don't know what happened there either.", "the blessed certificate is 1 in 20. it skips the climb and even cures an irregular. [0032, 0039]", "Discord login got skipped. Google only, for now. [0105]", "your email never shows. just your username, 3 to 16 characters, chosen once. [0123]", "the game port is closed to the internet. Caddy guards the door. [0118]", "Google login won't run in itch.io's frame, so the server hosts the web client itself. [0121]"]
; When she dozes off after 45 s without typing (before the zzz loop).
dozing=["mm... I'll just rest my eyes... for one tick...", "it's so quiet... wake me if anything breaks...", "*yawn* ...five minutes... maybe ten...", "I'm not falling asleep... I'm idling...", "the server's humming... so cozy..."]
; After a command the terminal doesn't know.
unknown=["hmm, not a command. yet. want me to write it a design log?", "I don't know that one. \\help knows everything I know~", "typo? happens to the best admins. mostly you, though ^^", "not a command, but it'd make a cute one.", "the terminal said no. I would've said yes."]
; When the same command is typed twice in a row.
repeat=["you asked that already... it's okay, I like saying it.", "same answer as last time! I checked twice for you.", "\\help again? are you just here to see me?", "déjà vu... or a bug. let's hope déjà vu."]
; When \enemies finds one marked AWAY.
stuck=["found a lost one! so far from home.", "AWAY... they always look so confused out there.", "that one wandered off. we should build them a way back.", "stuck, not gone. there's a difference, and it matters."]
; After \player set or \player levelup.
power=["with great admin power comes great \\player set responsibility.", "levels changed! they'll never know it was you~", "the server logs every command, you know. even that one.", "gentle with the levels. someone earned the old ones."]
; Hello lines between midnight and 5 am, local time.
late_night=["it's late, admin. one fix, then sleep. promise?", "the players are asleep. just us and the server now.", "a midnight patch? I'll be gentle with it.", "up late again... I'll keep you company."]
; Said while the blush animation plays.
blushing=["d-don't look at me like that!", "you're being nice again... stop it... (don't stop)", "eep.", "my pigment's acting up again...", "it's the slanting light! that's all it is!"]
; When the terminal closes (keep it up a moment, or show it in chat).
goodbye=["bye, admin! the world's in good hands. yours.", "closing already? ...okay. come back soon~", "I'll keep the terminal warm.", "see you next fix! <3", "go play your game. you made it, you should enjoy it."]