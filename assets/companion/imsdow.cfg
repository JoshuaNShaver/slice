; imsdow, the admin terminal's companion (design log 0146). Edit freely:
; lines are picked at random from each list. Write \\ for a backslash.

[imsdow]
name="imsdow"
; Chance (0-1) she's already asleep when the terminal opens.
asleep_on_open=0.3
; Commands typed while she's asleep before she wakes up (blushing).
commands_to_wake=3
; Chance (0-1) she says something after a command, when awake.
quip_after_command=0.35
; While resting awake, she says something every this many seconds (min, max).
quip_every=Vector2(25, 45)
; Seconds a line stays up, at least; longer lines stay longer.
line_time=6.0

[lines]
hello=["hi, admin! ~", "welcome back! <3", "oh! it's you ^^", "what are we fixing today?", "try \\help!", "imsdow, reporting for duty~"]
; When she opens already asleep.
asleep=["zzz...", "zzz... mm...", "...zzz"]
; Commands typed while she's asleep, before the last one.
mumbles=["mmm, a few more minutes...", "five more levels...", "zz... don't reroll my luck...", "mm... equilateral... so pretty...", "...not the pentagon door... the other one...", "zzz... certificate... mine...", "hnn... the server owns the saves...", "...corners first... recruit...", "mm... just one more mission..."]
; When she wakes up.
waking=["w-wasn't sleeping!", "I was just... resting my vertices!", "mm... I'm up, I'm up", "huh? oh! hi ^^;", "you saw nothing!!"]
; Shape puns.
puns=["I'd tell you a triangle joke, but it's a bit acute.", "don't be obtuse, try \\help!", "circles never win arguments. they just go around and around.", "I'm not lazy, I'm conserving angular momentum.", "that command was right on point. all three of them.", "let's just roll with it!", "hex-cellent work!", "no need to cut corners, you're doing great~", "two dimensions, zero problems.", "I'd go 3D, but my parents would never allow it.", "this bug looks a little... polygonal.", "you're my favourite admin. no angles about it.", "a square walks into a bar. it was a right angle.", "ugh, this log is so linear."]
; Design history, recalled while you work. (log numbers in brackets)
lore=["fun fact: families used to roll their first triangle. now you get to pick! [0050]", "equilateral used to be a starting choice. too easy! climb that apex 5° at a time~ [0031, 0065]", "jumps used to cost 25 energy. now they're free! bounce away~ [0087]", "it used to take 50 luck to double your odds. now 20 does it. generous, huh? [0049]", "irregulars get +20 luck. being different pays! [0049]", "the caves moved from the west wall to the underworld. nobody asked me. [0051]", "overworld houses are pentagons, by law. triangles and squares are too pointy~ [0060]", "Flatland houses have no windows. light's the same inside and out! [0060]", "set bonuses stay secret until you wear all five. shh, I didn't tell you. [0045]", "crits are double damage, in gold, with a '!'. I love the gold ones. [0047]", "only corners hurt. a face never hurt anybody! [0005]", "damage per corner is 180° minus the angle. pointier is meaner! [0005]", "irregulars can never ride up from the underworld. I'd smuggle you if I could. [0058]", "the underworld is chalk on slate. very moody. very me. [0056]", "colour was banned after the Colour Revolt... so don't tell anyone I'm pink. [0068, 0069]", "pigment is contraband. my hair is... extremely illegal. [0036]", "ten sides or more and you're a priest. practically a circle! [0010]", "priests sometimes can't have heirs. too many sides, too little time. [0017]", "die without an heir and the family ends. no pressure! [0015]", "squares get a house with 20 chest slots. triangles get... character. [0041, 0064]", "the General has recon, invasion and special ops. I'd pick snack ops. [0070]", "recon has secret stakes: 1 in 5 there's a Painted Gentleman. shh! [0088]", "hardtack, cheese, salt pork. the Quartermaster's menu is... rustic. [0084]", "a nose dive rises 3x a triangle's height. wheee! [0090]", "we moved from Oracle to Hetzner. I don't miss Oracle. [0102, 0103]", "free domain, priceless vibes: flatland-online.duckdns.org [0118]", "ENet got dropped. WebSocket for everyone! [0110]", "the server owns the saves now. no fibbing about your level~ [0097]", "newest login wins! your old tab gets politely shown the door. [0128]", "every panel has a little ✕ now. I fought for that. [0129]", "the web build updates itself on the next launch. never mid-session, promise. [0127]", "versions have to match exactly. even I check yours at the door. [0109]", "admins are only made in the database. so you're special~ [0125]", "I used to be a generated stick figure. then I got a glow-up! [0139, 0143]", "my backdrop went 60%, 45%, then 25% see-through. someone likes their privacy. [0140, 0142]", "\\enemies finds the lost ones. sparring partners just... wander off. [0137]", "shapes are plain; armor is crosshatching. Flatland fashion is very... lined. [0069]", "the north is still uncharted. ooh, mysterious~ [0062]", "a circle can still go to war. just for fun! [0073]", "max level is 20, about half an hour. then it's all renown! [0007]", "the drill yard drops leather. very fashionable for a straw dummy fight. [0072]", "special ops always has two bosses. Chromatistes never comes alone. [0083]", "the elevator up only takes 4 sides or more. rules are rules! [0054]", "the Pretender always drops a marriage certificate. romantic, in a way. [0029]"]
