[anim]
; Seconds per frame.
frame_time=0.32
; Frames in the order to play (1 = frame_1.png). Left out: each once, in name order.
sequence=[1, 2, 3, 4, 3, 4, 3, 2, 1]
; Where each frame is drawn, in image pixels, so she stays still between
; frames (the drawings sit a little differently on their canvases).
offsets=[Vector2(0, 0), Vector2(-23, 0), Vector2(14, 1), Vector2(-19, 1)]
