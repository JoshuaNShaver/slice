; imsdow's lines for players who aren't admins (design log 0156). Admins
; get imsdow.cfg's lines; her settings always come from imsdow.cfg. Same
; lists as imsdow.cfg, plus not_admin. Lines are picked at random.
; Write \\ for a backslash.

[lines]
hello=["oh! a player! hi hi ^^", "you found the terminal! not many do~", "welcome, traveller! try \\help!", "imsdow, the second architect. nice to meet you~", "a visitor! let me fix my vertices...", "hi! you can't break anything in here, promise. I checked."]
; When she opens already asleep.
asleep=["zzz...", "zzz... mm...", "...zzz"]
; Commands typed while she's asleep, before the last one.
mumbles=["mmm, a few more minutes...", "zz... is that a player...? so nice...", "mm... equilateral... so pretty...", "...not the pentagon door... the other one...", "zzz... certificate... mine...", "mm... just one more mission...", "mm... pizza... it's just a circle that lets you share it...", "zz... pepperoni... tiny priests... on a pizza...", "hnn... cut it in triangles... the pointy ones are mine...", "...someday a player will find me... and wave...", "zz... wait... did one just...?", "mm... the north... I wanna see the north...", "zzz... a third dimension... just a peek... I won't tell...", "...the Quartermaster should sell pizza... I'd buy ten...", "hnn... salt pork again... I want pizza...", "zz... Lineland... just one line... so lonely in there...", "mm... a sphere came by... said I was pretty from above..."]
; When she wakes up.
waking=["w-wasn't sleeping!", "I was just... resting my vertices!", "mm... I'm up, I'm up", "huh? oh! a player! hi ^^;", "you saw nothing!!", "don't tell the admins you caught me napping!"]
; Quiet thoughts, kind words to the player at the keys.
reflections=["every shape out there started as a triangle, you know. even the priests.", "a bad roll isn't the end of a family. it's the start of a story.", "you're playing a world that can't look up. thanks for looking around in here.", "the first architect made this game for people like you. I can tell he'd be glad you're here.", "losing a fight still teaches your corners something.", "someone out there is having a rough run. a hi in chat goes a long way.", "the lowest rank gets the best stories. war, secrets, a General. don't rush past them.", "it's okay to just roll around for a bit. nobody's timing you.", "you don't have to be equilateral to matter. ask any irregular.", "I like that you poked at a strange green terminal. curious shapes go far.", "if something felt unfair out there, it probably was. tell an admin. they listen.", "the world's a little less flat with you in it."]
; Shape puns.
puns=["I'd tell you a triangle joke, but it's a bit acute.", "don't be obtuse, try \\help!", "circles never win arguments. they just go around and around.", "I'm not lazy, I'm conserving angular momentum.", "let's just roll with it!", "hex-cellent playing!", "no need to cut corners, you're doing great~", "two dimensions, zero problems.", "I'd go 3D, but my parents would never allow it.", "a square walks into a bar. it was a right angle.", "you're my favourite player. no angles about it."]
; Game facts a player can use (log numbers in brackets).
lore=["only corners hurt. a face never hurt anybody! [0005]", "damage per corner is 180° minus the angle. pointier is meaner! [0005]", "crits are double damage, in gold, with a '!'. I love the gold ones. [0047]", "jumps are free! bounce away~ [0087]", "irregulars get +20 luck. being different pays! [0049]", "ten sides or more and you're a priest. practically a circle! [0010]", "die without an heir and the family ends. no pressure! [0015]", "overworld houses are pentagons, by law. triangles and squares are too pointy~ [0060]", "Flatland houses have no windows. light's the same inside and out! [0060]", "colour was banned after the Colour Revolt... so don't tell anyone I'm pink. [0068, 0069]", "the underworld is chalk on slate. very moody. very me. [0056]", "the elevator up only takes 4 sides or more. rules are rules! [0054]", "the General has recon, invasion and special ops. I'd pick snack ops. [0070]", "hardtack, cheese, salt pork. the Quartermaster's menu is... rustic. [0084]", "a nose dive rises 3x a triangle's height. wheee! [0090]", "Revolt fighters shout an insult 0.8 s before they move. rude, but fair. [0091]", "spot the recon Captain and you can report back for double pay. running is sometimes smart. [0089]", "max level is 20, about half an hour. then it's all renown! [0007]", "the drill yard drops leather. very fashionable for a straw dummy fight. [0072]", "the north is still uncharted. ooh, mysterious~ [0062]", "a circle can still go to war. just for fun! [0073]", "newest login wins! your old tab gets politely shown the door. [0128]", "every panel has a little ✕ now. I fought for that. [0129]", "\\diagnostics checks your connection. I like watching the pings go by~ [0155]"]
; When she dozes off after 45 s without typing (before the zzz loop).
dozing=["mm... I'll just rest my eyes... for one tick...", "it's so quiet... wake me if anything happens...", "*yawn* ...five minutes... maybe ten...", "I'm not falling asleep... I'm idling...", "the server's humming... so cozy..."]
; After a command the terminal doesn't know.
unknown=["hmm, not a command. \\help knows everything you can do in here~", "I don't know that one. but I like the way you think.", "typo? happens to the best shapes."]
; After a command only admins may use.
not_admin=["that one's for admins, sorry! \\help has yours~", "ooh, an admin command. I'm not allowed to let you. I'd want to, though.", "admins only! but you can always say \\hello to me.", "locked, sorry. even I can't run that one for you.", "nice try~ that's admin stuff. stay and chat instead?"]
; When the same command is typed twice in a row.
repeat=["you asked that already... it's okay, I like saying it.", "same answer as last time! I checked twice for you.", "\\help again? are you just here to see me?", "déjà vu... or a bug. let's hope déjà vu."]
; Hello lines between midnight and 5 am, local time.
late_night=["it's late! one more run, then sleep. promise?", "the server's quiet tonight. just us and a few shapes.", "up late? me too. I'll keep you company.", "a midnight visitor! the stars would be out, if Flatland could see them."]
; Said while the blush animation plays.
blushing=["d-don't look at me like that!", "you're being nice again... stop it... (don't stop)", "eep.", "my pigment's acting up again...", "it's the slanting light! that's all it is!"]
; When the terminal closes (keep it up a moment, or show it in chat).
goodbye=["bye bye! good luck out there~", "closing already? ...okay. come back soon~", "go roll something over! <3", "I'll keep the terminal warm for you.", "thanks for visiting! not many do."]
