[anim]
; Frames are numbered in name order:
;   1 sleep_bottom_left  2 sleep_bottom_right  3 sleep_top_left  4 sleep_top_right
; Played top left, top right, bottom left, bottom right (the sheet's order).
sequence=[3, 4, 1, 2]
; Seconds per frame.
frame_time=0.8
; Dozes off after this many seconds with nothing typed, and sleeps (looping)
; until you type.
after_quiet=45.0
loop=true
; Areas of each frame (same numbering) whose ink is drawn blush pink, in
; the frame's own pixels: Rect2(x, y, width, height).
blush=[[Rect2(330, 310, 50, 36), Rect2(240, 340, 36, 28)], [Rect2(333, 305, 55, 42), Rect2(228, 338, 40, 30)], [], [Rect2(333, 314, 55, 36), Rect2(222, 340, 40, 30)]]
