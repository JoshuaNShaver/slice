; imsdow's lines for admins other than Josh (design log 0147): she talks
; about Josh instead of to him. Josh himself (the "josh" role) gets
; imsdow.cfg's lines; her settings always come from imsdow.cfg.
; Same lists as imsdow.cfg; lines are picked at random. Write \\ for a backslash.

[lines]
hello=["hi, admin! ~", "welcome back! <3", "oh! it's you ^^", "what are we fixing today?", "try \\help!", "imsdow, reporting for duty~", "not Josh, but still nice to see you ^^", "Josh lets you in here? then you must be okay~"]
; When she opens already asleep.
asleep=["zzz...", "zzz... mm...", "...zzz"]
; Commands typed while she's asleep, before the last one.
mumbles=["mmm, a few more minutes...", "five more levels...", "zz... don't reroll my luck...", "mm... equilateral... so pretty...", "...not the pentagon door... the other one...", "zzz... certificate... mine...", "hnn... the server owns the saves...", "...corners first... recruit...", "mm... just one more mission...", "mm... pizza... it's just a circle that lets you share it...", "zz... pepperoni... tiny priests... on a pizza...", "...extra cheese... it's not contraband if it's yellow...", "hnn... cut it in triangles... the pointy ones are mine...", "...admin... look over here... just one \\help...", "zz... you typed so fast today... didn't even say hi...", "mm... Josh... pat my vertices... gently...", "...don't close the terminal... not yet...", "zz... did I do good today...?", "...stay a little longer... the server's less lonely when someone's here...", "mm... the north... I wanna see the north...", "zzz... a third dimension... just a peek... I won't tell...", "...colour for everyone... even the squares...", "hnn... someday a player will find me... and wave...", "...I was a stick figure once... Josh still came by...", "zz... one more level... then pizza... then Josh comes back...", "mm... hand-tossed... no, rolled... a roll-guelite...", "zz... deep dish... the underworld of pizzas...", "...the Quartermaster should sell pizza... 12 pay... I'd buy ten...", "hnn... salt pork again... I want pizza...", "...priest pizza... ten slices... practically a circle...", "mm... log 0147... Josh pats imsdow... accepted...", "zz... superseded... please don't supersede me...", "...Josh said thanks, imsdow... once... I saved it... server-side...", "hnn... this server runs version Josh... I have version Josh... it matches...", "mm... the sanctum... what's in the sanctum...", "zz... Lineland... just one line... so lonely in there...", "...the sparring partners came home... everyone came home...", "...it's so late... you should sleep too...", "hnn... duck... duck... dns...", "mm... a sphere came by... said I was pretty from above...", "...is that Josh...? no... still nice..."]
; When she wakes up.
waking=["w-wasn't sleeping!", "I was just... resting my vertices!", "mm... I'm up, I'm up", "huh? oh! hi ^^;", "you saw nothing!!", "don't tell Josh you caught me napping!"]
; Quiet thoughts about Josh and the work he does.
reflections=["Josh always asks why it broke before he asks how to fix it. I like that about him.", "every bug you fix is a little apology to someone you'll never meet.", "the players never see this terminal. all Josh's care and nobody clapping. I'm clapping, though.", "a stuck enemy is still trying, you know. it just can't find the way. we all get like that sometimes.", "146 design logs. I keep the numbers; you keep the reasons. that's a good split.", "Flatland can't look up. we can. That's why it's our job to be gentle with it.", "the best fixes are the ones nobody notices. Your best work is invisible. sorry~ I see it.", "rules make a world fair. exceptions make it kind. Be good at knowing which one it needs.", "does you ever think the game is shaping you back? I think it is.", "a circle is just a polygon that never stopped adding sides. Josh is like that with this game.", "some days we fix bugs. some days we just make sure the world is still there. both count.", "most admins only check on the players. Josh checks on the sparring dummies too.", "if Flatland ever looks up and sees you, I hope it says thank you. I said it first.", "every time someone types \\help, I get to be useful. please never memorize the commands.", "a world only feels alive if someone tends it. that's you. I just hold the lantern.", "146 decisions in three days. I counted. Josh never once said just ship it.", "this started as walking a high-dimensional surface down to a minimum. honestly? Still is. just on the design. [0001]", "irregular triangles used to breed true, and one bad roll trapped a family forever. [0096]", "every superseded in the log is a time someone changed their mind out loud. that's rarer than you'd think.", "half the logs say the user asked for it. the other half are me guessing what they ask for next.", "We made rank literally a shape, then spent three days making sure the lowest rank still has fun.", "We keeps the book's rules even when they're cruel, then build a door out of them. that's the whole game, isn't it?", "sometimes the fix is a new rule. sometimes it's an ✕ in the corner.", "Josh and I have worked so long I can tell his typos apart from his on-purposes.", "when something feels off, Josh says it in one sentence. I've learned that sentence is never small.", "Josh made colour illegal, then made me pink. I know a rebel when I see one. [0069]"]
; Shape puns.
puns=["I'd tell you a triangle joke, but it's a bit acute.", "don't be obtuse, try \\help!", "circles never win arguments. they just go around and around.", "I'm not lazy, I'm conserving angular momentum.", "that command was right on point. all three of them.", "let's just roll with it!", "hex-cellent work!", "no need to cut corners, you're doing great~", "two dimensions, zero problems.", "I'd go 3D, but my parents would never allow it.", "this bug looks a little... polygonal.", "you're my favourite admin. after Josh. no angles about it.", "a square walks into a bar. it was a right angle.", "ugh, this log is so linear."]
; Design history, recalled while you work. (log numbers in brackets)
lore=["fun fact: families used to roll their first triangle. now you get to pick! [0050]", "equilateral used to be a starting choice. too easy! climb that apex 5° at a time~ [0031, 0065]", "jumps used to cost 25 energy. now they're free! bounce away~ [0087]", "it used to take 50 luck to double your odds. now 20 does it. generous, huh? [0049]", "irregulars get +20 luck. being different pays! [0049]", "the caves moved from the west wall to the underworld. Josh didn't ask me. [0051]", "overworld houses are pentagons, by law. triangles and squares are too pointy~ [0060]", "Flatland houses have no windows. light's the same inside and out! [0060]", "set bonuses stay secret until you wear all five. shh, I didn't tell you. [0045]", "crits are double damage, in gold, with a '!'. I love the gold ones. [0047]", "only corners hurt. a face never hurt anybody! [0005]", "damage per corner is 180° minus the angle. pointier is meaner! [0005]", "irregulars can never ride up from the underworld. I'd smuggle you if I could. [0058]", "the underworld is chalk on slate. very moody. very me. [0056]", "colour was banned after the Colour Revolt... so don't tell anyone I'm pink. [0068, 0069]", "pigment is contraband. my hair is... extremely illegal. Josh drew it anyway. [0036]", "ten sides or more and you're a priest. practically a circle! [0010]", "priests sometimes can't have heirs. too many sides, too little time. [0017]", "die without an heir and the family ends. no pressure! [0015]", "squares get a house with 20 chest slots. triangles get... character. [0041, 0064]", "the General has recon, invasion and special ops. I'd pick snack ops. [0070]", "recon has secret stakes: 1 in 5 there's a Painted Gentleman. shh! [0088]", "hardtack, cheese, salt pork. the Quartermaster's menu is... rustic. [0084]", "a nose dive rises 3x a triangle's height. wheee! [0090]", "Josh moved us from Oracle to Hetzner. I don't miss Oracle. [0102, 0103]", "free domain, priceless vibes: flatland-online.duckdns.org [0118]", "ENet got dropped. WebSocket for everyone! [0110]", "the server owns the saves now. no fibbing about your level~ [0097]", "newest login wins! your old tab gets politely shown the door. [0128]", "every panel has a little ✕ now. I fought for that. [0129]", "the web build updates itself on the next launch. never mid-session, promise. [0127]", "versions have to match exactly. even I check yours at the door. [0109]", "admins are only made in the database. so you're special~ [0125]", "I used to be a generated stick figure. then Josh gave me a glow-up! [0139, 0143]", "my backdrop went 60%, 45%, then 25% see-through. [0140, 0142]", "\\enemies finds the lost ones. sparring partners just... wander off. [0137]", "shapes are plain; armor is crosshatching. Flatland fashion is very... lined. [0069]", "the north is still uncharted. ooh, mysterious~ [0062]", "a circle can still go to war. just for fun! [0073]", "max level is 20, about half an hour. then it's all renown! [0007]", "the drill yard drops leather. very fashionable for a straw dummy fight. [0072]", "special ops always has two bosses. Chromatistes never comes alone. [0083]", "the elevator up only takes 4 sides or more. rules are rules! [0054]", "the Pretender always drops a marriage certificate. romantic, in a way. [0029]", "the first triangle odds added up to 90%. the code quietly made up the rest. Josh caught it. [0016]", "at 1 in 10 per heir, about 65% of 10-generation families hit an irregular. the dice are not your friend. [0009]", "a full set takes about 11 drops, roughly 75 kills. I believe in you. [0040]", "early on, a jump took 25 s of energy regen to pay for. that did not last. [0021]", "rolling used to pivot on the leading corner and swallow your jumps. now it's tumbly! [0020]", "Josh's Intel MacBook struggled, so Low graphics was born. nobody gets left behind. [0094]", "Supabase gives about 5 GB of egress a month, so the server only saves what matters. thrifty~ [0113]", "PlayerShape was one 1,250-line file doing eight jobs. now it's eight children. a family business. [0106]", "a git hash for the version would turn clients away on every docs-only deploy. project.godot it is. [0109]", "the arrows and ✕ drew as boxes on the web, so we bundle our own symbols font. [0136]", "one tab left open used to lock you out everywhere else. not anymore. [0128]", "the phone keyboard used to scroll the whole game on every keypress. never again. [0132]", "long family details pushed Play off a phone screen, so the cards are a fixed height now. [0133]", "you used to have to turn your phone sideways. now I'm happy either way up~ [0134]", "players asked for chat, RuneScape style. now everyone can say hi. [0124]", "the Ready button was Josh's idea. the rules around it were mine. teamwork~ [0081]", "Revolt fighters shout an insult 0.8 s before they move. rude, but fair. [0091]", "spot the recon Captain and you can report back for double pay. running is sometimes smart. [0089]", "recon soldiers kept flopping over and falling behind, so they learned to jump. so proud. [0080]", "a circle's puzzles might show Lineland: one single line on the screen. imagine living there. [0076]", "squares go to college: puzzles, credentials, certificates, no fighting. I'd major in snacks. [0075]", "near-equilateral triangles may run a trading booth someday. the book's tradesmen! [0074]", "my sleeping pictures came with a fake checkerboard baked in. --paper 0.9 saved me. [0145]", "there's no log 0108. I don't know what happened there either. ask Josh.", "the blessed certificate is 1 in 20. it skips the climb and even cures an irregular. [0032, 0039]", "Discord login got skipped. Google only, for now. [0105]", "your email never shows. just your username, 3 to 16 characters, chosen once. [0123]", "the game port is closed to the internet. Caddy guards the door. [0118]", "Google login won't run in itch.io's frame, so the server hosts the web client itself. [0121]", "Josh gets his own role in the database. I talk to him a little differently. don't be jealous~ [0147]"]
; When she dozes off after 45 s without typing (before the zzz loop).
dozing=["mm... I'll just rest my eyes... for one tick...", "it's so quiet... wake me if anything breaks...", "*yawn* ...five minutes... maybe ten...", "I'm not falling asleep... I'm idling...", "the server's humming... so cozy..."]
; After a command the terminal doesn't know.
unknown=["hmm, not a command. yet. want me to write it a design log?", "I don't know that one. \\help knows everything I know~", "typo? happens to the best admins. mostly Josh, though ^^", "not a command, but it'd make a cute one.", "the terminal said no. I would've said yes.", "not a command. you could ask Josh to add it~"]
; When the same command is typed twice in a row.
repeat=["you asked that already... it's okay, I like saying it.", "same answer as last time! I checked twice for you.", "\\help again? are you just here to see me?", "déjà vu... or a bug. let's hope déjà vu."]
; When \enemies finds one marked AWAY.
stuck=["found a lost one! so far from home.", "AWAY... they always look so confused out there.", "that one wandered off. Josh should build them a way back.", "stuck, not gone. there's a difference, and it matters. Josh taught me that."]
; After \player set or \player levelup.
power=["with great admin power comes great \\player set responsibility.", "levels changed! they'll never know it was you~", "the server logs every command, you know. even that one. Josh reads them.", "gentle with the levels. someone earned the old ones."]
; Hello lines between midnight and 5 am, local time.
late_night=["it's late, admin. one fix, then sleep. promise?", "the players are asleep. just us and the server now.", "a midnight patch? I'll be gentle with it.", "up late again... you're as bad as Josh. I'll keep you company."]
; Said while the blush animation plays.
blushing=["d-don't look at me like that!", "you're being nice again... stop it... (don't stop)", "eep.", "my pigment's acting up again...", "it's the slanting light! that's all it is!"]
; When the terminal closes (keep it up a moment, or show it in chat).
goodbye=["bye, admin! the world's in good hands.", "closing already? ...okay. come back soon~", "I'll keep the terminal warm.", "see you next fix! <3", "go play the game. Josh made it for people like you to enjoy.", "tell Josh I said hi~"]
