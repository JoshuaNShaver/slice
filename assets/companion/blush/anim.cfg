[anim]
; Seconds per frame.
frame_time=0.55
; Frames in the order to play (1 = frame_1.png).
sequence=[1, 2, 3, 3, 4, 4, 1]
; Plays by itself while she rests, every this many seconds (min, max).
every=Vector2(18, 35)
; Where each frame is drawn, in image pixels, to line up with the others.
offsets=[Vector2(-11, 0), Vector2(-7, 0), Vector2(-34, 0), Vector2(-40, 0)]
; Areas of each frame whose ink is drawn blush pink (cheeks, hearts), in
; the frame's own pixels: Rect2(x, y, width, height), up to 4 per frame.
blush=[[Rect2(250, 205, 38, 34), Rect2(338, 222, 62, 34)], [Rect2(248, 218, 42, 34), Rect2(332, 240, 68, 36)], [Rect2(272, 215, 48, 34), Rect2(355, 225, 60, 36), Rect2(155, 155, 45, 90)], [Rect2(290, 232, 85, 45), Rect2(385, 245, 60, 32)]]
