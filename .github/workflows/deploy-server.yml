# Manual deploy of the dedicated server. Actions tab -> Deploy server -> Run workflow.
# Uploads the committed source of the chosen branch/tag to the VPS and
# restarts the server there (see deploy/README.md for the one-time setup).
name: Deploy server

on:
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          RELEASE="/opt/slice/releases/${GITHUB_SHA}"
          git archive --format=tar.gz HEAD \
            | ssh "slice@$HOST" "rm -rf '$RELEASE' && mkdir -p '$RELEASE' && tar -xz -C '$RELEASE'"

      - name: Activate release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh "slice@$HOST" "bash /opt/slice/releases/${GITHUB_SHA}/deploy/activate-release.sh"
