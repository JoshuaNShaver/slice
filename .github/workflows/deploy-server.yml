# Deploys the committed source to the game server and restarts it.
# Actions tab -> Deploy server -> Run workflow. Also run at the end of
# Provision server. See deploy/README.md.
name: Deploy server

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: slice-server
      cancel-in-progress: false
    env:
      SERVER_NAME: ${{ vars.SERVER_NAME || 'slice-server' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: bash deploy/ci/ssh-setup.sh

      - name: Upload release
        run: |
          RELEASE="/opt/slice/releases/${GITHUB_SHA}"
          git archive --format=tar.gz HEAD \
            | ssh slice@server "rm -rf '$RELEASE' && mkdir -p '$RELEASE' && tar -xz -C '$RELEASE'"

      - name: Activate release
        run: ssh slice@server "bash /opt/slice/releases/${GITHUB_SHA}/deploy/activate-release.sh"
