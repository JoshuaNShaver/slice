# Deploys the committed source to the game server and restarts it.
# Actions tab -> 002-deploy-code -> Run workflow. Also run at the end of
# 001-full-deploy. See deploy/README.md.
name: 002-deploy-code

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Database migrations and auth settings first, so new server code never
  # meets old tables (design log 0105).
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: slice-server
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations to apply
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes

      - name: Auth settings to change
        run: supabase config diff

      - name: Apply auth settings
        run: supabase config push --yes

  deploy:
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: slice-server
      cancel-in-progress: false
    env:
      SERVER_NAME: ${{ vars.SERVER_NAME || 'slice-server' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: bash deploy/ci/ssh-setup.sh

      - name: Upload release
        run: |
          RELEASE="/opt/slice/releases/${GITHUB_SHA}"
          git archive --format=tar.gz HEAD \
            | ssh slice@server "rm -rf '$RELEASE' && mkdir -p '$RELEASE' && tar -xz -C '$RELEASE'"

      - name: Activate release
        run: ssh slice@server "bash /opt/slice/releases/${GITHUB_SHA}/deploy/activate-release.sh"
