# Creates (if asked) and configures the Hetzner game server, installs its
# secrets, then deploys. Actions tab -> 001-full-deploy -> Run workflow.
# Safe to run again. See deploy/README.md.
name: 001-full-deploy

on:
  workflow_dispatch:
    inputs:
      create:
        description: Create the server if it doesn't exist (costs money)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: slice-server
      cancel-in-progress: false
    env:
      SERVER_NAME: ${{ vars.SERVER_NAME || 'slice-server' }}
      SERVER_TYPE: ${{ vars.SERVER_TYPE || 'cax11' }}
      SERVER_LOCATION: ${{ vars.SERVER_LOCATION || 'nbg1' }}
      # Players join wss://SERVER_DOMAIN through Caddy (design log 0118);
      # set it to "none" for plain ws:// on SERVER_PORT instead.
      SERVER_DOMAIN: ${{ vars.SERVER_DOMAIN || 'flatland-online.duckdns.org' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '24680' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the server exists
        env:
          CREATE: ${{ inputs.create }}
        run: bash deploy/ci/ensure-server.sh

      - name: Set up SSH
        run: bash deploy/ci/ssh-setup.sh

      - name: Wait for SSH
        run: |
          for _ in $(seq 1 36); do
            ssh root@server true && exit 0
            sleep 5
          done
          echo "::error::Server didn't answer on SSH within 3 minutes."
          exit 1

      - name: Configure the server
        run: |
          DOMAIN="$SERVER_DOMAIN"
          [ "$DOMAIN" = none ] && DOMAIN=""
          ssh root@server "bash -s -- '$DEPLOY_PUBKEY' '$DOMAIN' '$SERVER_PORT'" < deploy/setup-server.sh

      - name: Check and install secrets
        env:
          HCLOUD_READ_TOKEN: ${{ secrets.HCLOUD_READ_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: bash deploy/ci/install-secrets.sh

  deploy:
    needs: provision
    uses: ./.github/workflows/002-deploy-code.yml
    secrets: inherit
